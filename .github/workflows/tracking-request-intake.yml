name: Tracking request intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: ${{ startsWith(github.event.issue.title, '[Tracking]') }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate current report item
        id: request
        env:
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          import json, os, re
          event = json.load(open(os.environ["EVENT_PATH"], encoding="utf-8"))
          body = event["issue"].get("body") or ""
          match = re.search(r"(?m)^REPORT_ITEM_ID:\s*(np-[a-z0-9-]{3,120})\s*$", body)
          report = json.load(open("config/nepal-report.json", encoding="utf-8"))
          valid = {
              item.get("id")
              for country in report.get("countries", {}).values()
              for section in country.get("sections", [])
              for item in section.get("items", [])
          }
          if not match or match.group(1) not in valid:
              raise SystemExit("Tracking request must contain one valid current REPORT_ITEM_ID")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"item_id={match.group(1)}\n")
          PY
      - name: Activate tracking request
        run: |
          gh label create tracking-request --color C81E4A --description "Daily monitored briefing topic" --force
          gh issue edit "${{ github.event.issue.number }}" --add-label tracking-request
          gh issue comment "${{ github.event.issue.number }}" --body "Daily tracking is active for \`${{ steps.request.outputs.item_id }}\`. Keep this issue open to continue tracking; close it to stop. Email goes to the repository-configured recipient."
