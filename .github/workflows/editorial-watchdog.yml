name: Nepal editorial watchdog

on:
  schedule:
    - cron: '30 23 * * *' # 02:30 Asia/Baghdad (05:15 Nepal)
  workflow_dispatch:
    inputs:
      force:
        description: Ignore today's Codex completion marker (diagnostic only)
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: nepal-editorial-watchdog
  cancel-in-progress: false

jobs:
  fallback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test watchdog gates
        run: python -m unittest discover -s scripts -p 'test_nepal_*.py'
      - name: Check Codex marker and run fallback if needed
        if: ${{ inputs.force != true }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/fallback_nepal_deepseek.py
      - name: Force fallback diagnostic
        if: ${{ inputs.force == true }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/fallback_nepal_deepseek.py --force
      - name: Rebuild public data
        run: |
          npm install --legacy-peer-deps --no-audit --no-fund
          npm run sync-data
          npm run validate-data
      - name: Publish watchdog status
        id: publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add config/editorial-status.json config/deepseek-fallback-digest.json data/editorial-status.json data/deepseek-fallback-digest.json data/nepal.json
          if ! git diff --staged --quiet; then
            git commit -m 'data: record Nepal editorial watchdog'
            git pull --rebase origin main
            git push origin HEAD:main
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy changed watchdog output
        if: ${{ steps.publish.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
